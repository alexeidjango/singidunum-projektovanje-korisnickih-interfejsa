@if (modal.register()) {
  <div class="modal d-block" tabindex="-1" style="background: rgba(0,0,0,.5)">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Registracija</h5>
          <button type="button" class="btn-close" (click)="modal.close()"></button>
        </div>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Ime</label>
                <input class="form-control" formControlName="firstName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Prezime</label>
                <input class="form-control" formControlName="lastName">
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email">
              </div>
              <div class="col-md-6">
                <label class="form-label">Telefon</label>
                <input type="tel" class="form-control" formControlName="phone">
              </div>
              <div class="col-12">
                <label class="form-label">Adresa</label>
                <input class="form-control" formControlName="address">
              </div>
              <div class="col-12">
                <label class="form-label d-block">Omiljene vrste igračaka</label>
                @for (t of allTypes; track t.value) {
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox"
                           [checked]="favoriteTypes.includes(t.value)"
                           (change)="toggleType(t.value)" id="ft-{{ t.value }}">
                    <label class="form-check-label" for="ft-{{ t.value }}">{{ t.label }}</label>
                  </div>
                }
              </div>
              <div class="col-md-4">
                <label class="form-label">Korisničko ime</label>
                <input class="form-control" formControlName="username">
              </div>
              <div class="col-md-4">
                <label class="form-label">Lozinka</label>
                <input type="password" class="form-control" formControlName="password">
              </div>
              <div class="col-md-4">
                <label class="form-label">Potvrda lozinke</label>
                <input type="password" class="form-control" formControlName="repeat">
              </div>
            </div>
          </div>
          <div class="modal-footer justify-content-between">
            <button type="button" class="btn btn-link" (click)="modal.openLogin()">
              Već imate nalog? Prijavite se
            </button>
            <button type="submit" class="btn btn-primary">Registruj se</button>
          </div>
        </form>
      </div>
    </div>
  </div>
}
