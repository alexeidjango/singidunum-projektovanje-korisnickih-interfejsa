@if (reservation(); as r) {
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/korpa">Korpa</a></li>
      <li class="breadcrumb-item active">Ocena</li>
    </ol>
  </nav>

  <div class="card mx-auto" style="max-width: 540px;">
    <div class="card-header"><h5 class="mb-0">Ocenite igračku „{{ r.toy.name }}"</h5></div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label d-block">Ocena</label>
          <div class="fs-2 text-warning" role="radiogroup">
            @for (n of stars; track n) {
              <i class="fa-star" role="button"
                 [class.fa-solid]="form.value.rating >= n"
                 [class.fa-regular]="form.value.rating < n"
                 (click)="setRating(n)"></i>
            }
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Komentar <span class="text-muted">(opciono)</span></label>
          <textarea class="form-control" rows="3" formControlName="comment"
                    placeholder="Vaše iskustvo sa igračkom…"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Pošalji ocenu</button>
          <a routerLink="/korpa" class="btn btn-outline-secondary">Otkaži</a>
        </div>
      </form>
    </div>
  </div>
}
