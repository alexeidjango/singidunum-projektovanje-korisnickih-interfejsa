<h1 class="h3 mb-4">Moj profil</h1>

<div class="row g-4">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">Podaci</h5></div>
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Ime</label>
              <input class="form-control" formControlName="firstName">
            </div>
            <div class="col-md-6">
              <label class="form-label">Prezime</label>
              <input class="form-control" formControlName="lastName">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email">
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefon</label>
              <input type="tel" class="form-control" formControlName="phone">
            </div>
            <div class="col-12">
              <label class="form-label">Adresa</label>
              <input class="form-control" formControlName="address">
            </div>
            <div class="col-12">
              <label class="form-label d-block">Omiljene vrste igračaka</label>
              @for (t of allTypes; track t.value) {
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox"
                         [checked]="favoriteTypes.includes(t.value)"
                         (change)="toggleType(t.value)" id="pf-{{ t.value }}">
                  <label class="form-check-label" for="pf-{{ t.value }}">{{ t.label }}</label>
                </div>
              }
            </div>
          </div>
        </div>
        <div class="card-footer text-end">
          <button type="submit" class="btn btn-primary">Sačuvaj</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-lg-5">
    <div class="card">
      <div class="card-header"><h5 class="mb-0">Promeni lozinku</h5></div>
      <form [formGroup]="passwordForm" (ngSubmit)="savePassword()" novalidate>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Trenutna lozinka</label>
            <input type="password" class="form-control" formControlName="current">
          </div>
          <div class="mb-3">
            <label class="form-label">Nova lozinka</label>
            <input type="password" class="form-control" formControlName="next">
          </div>
          <div class="mb-3">
            <label class="form-label">Potvrda</label>
            <input type="password" class="form-control" formControlName="repeat">
          </div>
        </div>
        <div class="card-footer text-end">
          <button type="submit" class="btn btn-secondary">Promeni lozinku</button>
        </div>
      </form>
    </div>
    <a routerLink="/korpa" class="btn btn-link mt-2">Vaše rezervacije →</a>
  </div>
</div>
